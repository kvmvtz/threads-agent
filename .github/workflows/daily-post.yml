name: Daily Threads post

on:
  schedule:
    # 19:00 Europe/Prague = 17:00 UTC while Prague is on CEST (UTC+2, roughly
    # late March - late October). Once Prague switches to CET (UTC+1) in late
    # October, this fires at 18:00 local — update to "0 18 * * *" then, and
    # back to "0 17 * * *" after the following spring change.
    - cron: '0 17 * * *'
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab to test

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run today's post
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: npm run run-daily
