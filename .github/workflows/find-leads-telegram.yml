name: Telegram lead finder

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours — deliberately not more often (see scripts/find-leads-telegram.js)
  workflow_dispatch: {} # trigger manually to test / run on demand

permissions:
  contents: write
  issues: write

jobs:
  find-leads-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: Search Telegram chats for leads
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/find-leads-telegram.js
