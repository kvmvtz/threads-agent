name: Backfill lead phone numbers (one-off)

# Manual-only utility: fills in the "Телефон" column for leads_found.csv rows
# that were created before that column existed. See scripts/backfill-phones.js
# for details. Safe to re-run — already-filled rows are skipped.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backfill-phones:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: Backfill phone numbers
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node scripts/backfill-phones.js
